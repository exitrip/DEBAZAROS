#User Configuration

#OE_TERMINAL = "tmux"

IMAGE_BOOT_FILES:zynq = "BOOT.BIN boot.scr uImage system.dtb"


IMAGE_FSTYPES:remove = "cpio cpio.gz cpio.bz2 cpio.xz cpio.lzma cpio.lz4 cpio.gz.u-boot"
IMAGE_FSTYPES_DEBUGFS:remove = "cpio cpio.gz cpio.bz2 cpio.xz cpio.lzma cpio.lz4 cpio.gz.u-boot"

# DEBAZAROS: ffmpeg (and its codecs) carries LICENSE_FLAGS "commercial".
# Yocto honister (PetaLinux 2022.x) reads LICENSE_FLAGS_WHITELIST; newer
# releases read LICENSE_FLAGS_ACCEPTED. Set both.
LICENSE_FLAGS_WHITELIST:append = " commercial"
LICENSE_FLAGS_ACCEPTED:append = " commercial"

# DEBAZAROS 2026-11-05: OpenSSH replaces Dropbear (rootfs_config). ebaz has an
# empty password (CONFIG_ADD_EXTRA_USERS): Dropbear accepted it; for OpenSSH
# this sets PermitEmptyPasswords yes, so access stays as before.
EXTRA_IMAGE_FEATURES:append = " allow-empty-password"
# perf without its Perl / Python scripting (tens of MB): counters, record,
# report (tui), trace
PACKAGECONFIG:pn-perf = "tui libunwind"
