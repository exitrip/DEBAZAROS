# DEBAZAROS 2026-11-05: speed over size (user: boot time does not matter),
# analysis support that costs nothing until it is used.
# -O2 instead of -Os (-O3 is offered only for ARC in 5.15 and not supported)
# CONFIG_CC_OPTIMIZE_FOR_SIZE is not set
CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
# perf (PMU counters: already on) + tracepoints for perf / trace-cmd (static
# keys: a no-op until enabled). No function tracer: its hook is in every
# function. Full preemption stays (debazd's real-time vsync and PWM threads).
CONFIG_FTRACE=y
CONFIG_ENABLE_DEFAULT_TRACERS=y
# CONFIG_FUNCTION_TRACER is not set
CONFIG_KPROBES=y
CONFIG_KPROBE_EVENTS=y
CONFIG_UPROBES=y
CONFIG_UPROBE_EVENTS=y
CONFIG_DEBUG_FS=y
# I2C subordinate (target) mode of the Cadence I2C, EEPROM back-end (bound
# only on request: echo slave-24c02 0x1042 > /sys/bus/i2c/devices/i2c-0/new_device)
CONFIG_I2C_SLAVE=y
CONFIG_I2C_SLAVE_EEPROM=y
