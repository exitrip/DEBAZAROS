# DEBAZAROS 2026-10-28: ALSA MIDI. Live MIDI will come over the network
# (OSC -> a synth, or RTP-MIDI with rtpmidid, which needs the sequencer);
# there is no MIDI hardware (no USB port; serial MIDI on UART0 would need an
# opto input board). Built in (=y): small, and no module packaging needed.
CONFIG_SND_SEQUENCER=y
CONFIG_SND_SEQ_DUMMY=y
CONFIG_SND_HRTIMER=y
CONFIG_SND_SEQ_HRTIMER_DEFAULT=y
CONFIG_SND_RAWMIDI=y
CONFIG_SND_VIRMIDI=y
# an ALSA loopback card (snd-aloop) for routing / network audio tools later
CONFIG_SND_ALOOP=y
