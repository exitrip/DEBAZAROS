# /etc/asound.conf - DEBAZAROS (2026-10-28). The default ALSA device is the
# DEBAZ card (driver debaz-audio): playback HDMI 0, capture HDMI 2 In, both
# through plug (other rates / formats are converted). "!" overrides the
# PulseAudio default of alsa-plugins (99-pulseaudio-default.conf): there is
# no PulseAudio server in the image.
pcm.!default {
	type asym
	playback.pcm "plughw:DEBAZ,0"
	capture.pcm "plughw:DEBAZ,2"
}
ctl.!default {
	type hw
	card DEBAZ
}
