# /etc/asound.conf - DEBAZAROS (2026-10-28). The default ALSA device is the
# DEBAZ card (driver debaz-audio): playback HDMI 0, capture HDMI 2 In, both
# through plug (other rates / formats are converted). "!" overrides the
# PulseAudio default of alsa-plugins (99-pulseaudio-default.conf): there is
# no PulseAudio server in the image.
pcm.!default {
	type asym
	playback.pcm "plughw:DEBAZ,0"
	capture.pcm "plughw:DEBAZ,2"
}
ctl.!default {
	type hw
	card DEBAZ
}

# Taps (2026-11-20): the DEBAZ outputs with a copy of the audio for debazd's
# analysis (react.c source "synth"): plug (any format) -> file (the copy, raw
# S16_LE 48 kHz stereo) -> the hardware. debazd makes and reads the FIFOs
# /tmp/dztap.<n>; without debazd a player would block at the open
# (sw/tools/dzsynth.sh uses a tap only while debazd runs).
#   aplay -D debaz_tap1 x.wav     fluidsynth -a alsa -o audio.alsa.device=debaz_tap1
pcm.debaz_tap0 {
	type plug
	slave.pcm "debaz_tapf0"
}
pcm.debaz_tapf0 {
	type file
	slave.pcm "hw:DEBAZ,0"
	file "/tmp/dztap.0"
	format "raw"
}
pcm.debaz_tap1 {
	type plug
	slave.pcm "debaz_tapf1"
}
pcm.debaz_tapf1 {
	type file
	slave.pcm "hw:DEBAZ,1"
	file "/tmp/dztap.1"
	format "raw"
}
pcm.debaz_tap3 {
	type plug
	slave.pcm "debaz_tapf3"
}
pcm.debaz_tapf3 {
	type file
	slave.pcm "hw:DEBAZ,3"
	file "/tmp/dztap.3"
	format "raw"
}
