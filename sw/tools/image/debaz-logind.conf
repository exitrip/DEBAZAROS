# debaz-logind.conf -> /etc/systemd/logind.conf.d/debaz.conf (2026-11-18).
# OpenSSH (since the 20261105 image) runs each login as a logind session, and
# systemd 249 is built with KillUserProcesses=yes: at the logout it stopped
# every program the session started, also with setsid (a debazd restart,
# dzstart.sh / plreload.sh / dzweb started by hand). Dropbear made no
# sessions. With "no" the programs survive the logout again.
[Login]
KillUserProcesses=no
