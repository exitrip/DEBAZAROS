# /etc/debaz/dzstart.conf - the image's bring-up settings (dzstart.sh).
# A /home/ebaz/dzstart.conf replaces this file (per-card settings).
#
# BITSTREAM: a .bit.bin in /lib/firmware to load at boot. Empty = keep the
# bitstream of BOOT.BIN (the image's BOOT.BIN carries the current one, so
# no load is needed). The image also has the fallback bitstreams in
# /lib/firmware (ls /lib/firmware/*.bit.bin).
BITSTREAM=
# hdmi2 arguments: the video mode of both outputs (dzctl /video/modes)
HDMI2_ARGS="-r 1280x720"
# 1 = start the web app (port 8080)
WEB=1
