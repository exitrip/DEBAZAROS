# /etc/debaz/dzstart.conf - the image's bring-up settings (dzstart.sh).
# A /data/debaz/dzstart.conf replaces this file (per-card settings, on the
# data partition: the root becomes read-only later). Start from a copy:
#   sudo cp /etc/debaz/dzstart.conf /data/debaz/dzstart.conf
#
# BITSTREAM: a .bit.bin in /lib/firmware to load at boot. Empty = keep the
# bitstream of BOOT.BIN (the image's BOOT.BIN carries the current one, so
# no load is needed). The image also has the fallback bitstreams in
# /lib/firmware (ls /lib/firmware/*.bit.bin).
BITSTREAM=
# hdmi2 arguments: the video mode of both outputs (dzctl /video/modes)
HDMI2_ARGS="-r 1280x720"
# 1 = start the web app (port 8080)
WEB=1
# boot show (installations): after a fresh start (boot or PL load) load
# this show and go to this cue; empty = none. A debazd restart resumes the
# running state instead.
SHOW=
CUE=
# MIDI synth (dzaudio: fluidsynth + routing matrix) started after debazd:
# outputs (0,1 = HDMI 0 + HDMI 1 = 4 channels; 1 = HDMI 1 only; 3 = I2S, no
# hardware yet) [soundfont in /media/debaz/soundfonts] [1 = reverb + chorus]
# [routing both|split|pair<N>], e.g. SYNTH="0,1" or SYNTH="0,1 default.sf2 0
# split". Empty = off (by hand: sudo dzsynth.sh start). While it runs, its
# outputs play no movie audio.
SYNTH=
