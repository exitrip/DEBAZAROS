# /etc/systemd/system.conf.d/debaz-watchdog.conf (2026-11-19, NOT installed
# by default - see sw/README.md "Services"): systemd feeds the Zynq hardware
# watchdog (cdns-wdt f8005000, CONFIG_CADENCE_WATCHDOG=y); a hung kernel or
# PID 1 resets the board after 30 s, then debaz.service brings it back (and
# dzstart.conf SHOW= / CUE= the show). Activate: copy here, then
# `systemctl daemon-reexec` (or reboot). Check: systemctl show -p RuntimeWatchdogUSec
[Manager]
RuntimeWatchdogSec=30s
RebootWatchdogSec=2min
