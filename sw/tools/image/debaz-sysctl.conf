# debaz-sysctl.conf -> /etc/sysctl.d/debaz.conf (2026-11-18). perf for ebaz:
# with the default 2 a user may count only user space, and the Cortex-A9 PMU
# cannot exclude the kernel, so every hardware event read "not supported".
# -1 = no limit (user: ebaz needs no limits on the hardware).
kernel.perf_event_paranoid = -1
