<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<title>DEBAZAROS</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="icon.svg" alt="" width="28" height="28">
    <span>DEBAZAROS</span>
  </div>
  <div class="unit">
    <label class="sr" for="unit">Unit</label>
    <select id="unit" title="Unit to control"></select>
    <button id="scan" class="ghost" title="Find units on the network">Scan</button>
    <label class="all" title="Send every control to all units"><input type="checkbox" id="sendall"> all units</label>
  </div>
  <div class="status">
    <span id="st-conn" class="chip off" title="Connection to the unit">offline</span>
    <span id="st-vsync" class="chip" title="Display frame clock">vsync –</span>
    <span id="st-input" class="chip" title="HDMI input">input –</span>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" data-tab="displays" aria-selected="true">Displays</button>
  <button role="tab" data-tab="effects">Effects</button>
  <button role="tab" data-tab="lfo">Oscillators</button>
  <button role="tab" data-tab="paint">Paint</button>
  <button role="tab" data-tab="media">Media</button>
  <button role="tab" data-tab="audio">Audio</button>
  <button role="tab" data-tab="console">Console</button>
</nav>

<main>
  <section id="tab-displays" class="tab active"></section>
  <section id="tab-effects" class="tab"></section>
  <section id="tab-lfo" class="tab"></section>
  <section id="tab-paint" class="tab"></section>
  <section id="tab-media" class="tab"></section>
  <section id="tab-audio" class="tab"></section>
  <section id="tab-console" class="tab"></section>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="app.js"></script>
</body>
</html>
