<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f12">
<title>DEBAZAROS Fleet</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<style>
  .fleet { max-width: 1300px; margin: 0 auto; padding: var(--gap); display: grid; gap: var(--gap); }
  .fleet .grid { display: grid; gap: var(--gap); grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
  .units { width: 100%; border-collapse: collapse; font-size: 13px; }
  .units th, .units td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  .units th { color: var(--dim); font-weight: 500; }
  .units td.num { font-variant-numeric: tabular-nums; }
  .units tr.off td { opacity: 0.55; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--bad); margin-right: 6px; }
  .dot.on { background: var(--ok); }
  .wrap { overflow-x: auto; }
  .log { font-family: var(--mono); font-size: 12px; min-height: 3em; max-height: 260px; overflow: auto; white-space: pre;
    background: var(--panel2); color: var(--text); border-radius: 8px; padding: 8px; margin: 0; }
  .fleet input[type=text] { min-width: 0; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="icon.svg" alt="" width="28" height="28">
    <span>DEBAZAROS fleet</span>
  </div>
  <div class="status">
    <span id="st-sum" class="chip">–</span>
    <a class="button ghost" href="./" title="the full UI of the unit that served this page">Unit UI</a>
  </div>
</header>
<main id="fleet" class="fleet"></main>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="fleet.js"></script>
</body>
</html>
